<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Low Poly Rally</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1018'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <p id="fallback" hidden>This browser cannot display the rally.</p>
    <canvas id="view"></canvas>
    <p id="speed" hidden>0 km/h</p>
    <button id="back" type="button" hidden>Menu</button>
    <section id="menu" aria-label="Level menu">
      <div class="moon" aria-hidden="true"></div>
      <div class="ridge" aria-hidden="true"></div>
      <div class="road" aria-hidden="true"></div>
      <h1>Stages</h1>
      <div class="choices">
        <button type="button" data-time="night" class="is-selected">Night</button>
        <button type="button" data-time="day">Day</button>
      </div>
      <div class="cars">
        <button type="button" data-car="hatch" class="is-selected">
          <span class="silhouette hatch" aria-hidden="true"></span>
          Hatch
        </button>
        <button type="button" data-car="coupe">
          <span class="silhouette coupe" aria-hidden="true"></span>
          Coupe
        </button>
        <button type="button" data-car="wagon">
          <span class="silhouette wagon" aria-hidden="true"></span>
          Wagon
        </button>
      </div>
      <div class="places">
        <button type="button" data-place="0">
          <span class="scene" aria-hidden="true">
            <span class="pine"></span>
            <span class="pine far"></span>
          </span>
          Night snow
        </button>
        <button type="button" data-place="1">
          <span class="scene" aria-hidden="true">
            <span class="pine"></span>
            <span class="pine"></span>
            <span class="pine far"></span>
          </span>
          Night forest
        </button>
        <button type="button" data-place="2">
          <span class="scene" aria-hidden="true">
            <span class="stone"></span>
            <span class="stone far"></span>
          </span>
          Night rock
        </button>
      </div>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
